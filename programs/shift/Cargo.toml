[package]
name = "shift"
version = "0.1.0"
description = "SHIFT Fantasy Card Game On-Chain Solana Anchor Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shift"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"
